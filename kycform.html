<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nabil Bank KYC Form</title>
</head>
<body>
	<h1>Nabil Bank KYC Form</h1>
	<p>Please fill in your basic information.</p>

	<form>
		<p>
			<label for="name">Full Name:</label><br>
			<input type="text" id="name">
		</p>

		<p>
			<label for="date-of-birth">Date of Birth:</label><br>
			<input type="date" id="date-of-birth">
		</p>

		<p>
			<label for="phone">Phone Number:</label><br>
			<input type="tel" id="phone">
		</p>

		<p>
			<label for="citizenship-number">Citizenship Number:</label><br>
			<input type="text" id="citizenship-number">
		</p>

		<p>
			<label for="address">Address:</label><br>
			<textarea id="address" rows="3" cols="30"></textarea>
		</p>

		<p>
			<input type="checkbox" id="agree">
			<label for="agree">I confirm that the information is correct.</label>
		</p>

		<button type="submit">Submit</button>
		<button type="reset">Clear</button>
	</form>
</body>
</html>
